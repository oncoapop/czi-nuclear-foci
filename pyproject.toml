[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "czi-nuclear-foci"
version = "0.1.0"
description = "Config-driven ZEISS CZI nuclear foci and co-localisation analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "reportlab",
  "scipy",
  "scikit-image",
]

[project.scripts]
czi-foci = "czi_foci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
